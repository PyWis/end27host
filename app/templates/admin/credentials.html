{% extends "admin/base.html" %}
{% block content %}<div class="box narrow">
<h2>{{ 'Imposta le tue credenziali' if g.user.must_change else 'Cambia credenziali' }}</h2>
{% if g.user.must_change %}<p class="desc">Al primo accesso devi cambiare {{ 'email e password' if g.user.is_superadmin else 'la password' }}.</p>{% endif %}
<form class="f" method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Email</label><input type="email" name="email" value="{{ '' if (g.user.must_change and g.user.is_superadmin) else g.user.email }}" {{ '' if g.user.is_superadmin else 'readonly' }} required>
<label>Nuova password (min 10 caratteri)</label><input type="password" name="password" minlength="10" required>
<label>Ripeti password</label><input type="password" name="password2" minlength="10" required>
<p><button class="btn">Salva</button></p></form></div>{% endblock %}
